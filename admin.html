<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - ULTRA TOP UP BD</title>
<meta name="robots" content="noindex,nofollow">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f2f2f2;padding-bottom:30px}
.top{background:#111;color:#fff;padding:16px;text-align:center;position:sticky;top:0;z-index:10}
.top b{font-size:19px}.top span{color:#00c853}
.wrap{max-width:520px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:14px;padding:16px;margin-top:12px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;margin-top:10px;font-size:14px}
.btn{width:100%;background:#00c853;color:#fff;border:none;padding:14px;border-radius:12px;font-weight:900;margin-top:12px;font-size:15px;cursor:pointer}
.btn2{width:100%;background:#111;color:#fff;border:none;padding:12px;border-radius:10px;font-weight:900;margin-top:10px;cursor:pointer}
.btnRed{background:#ff2d55}
.btnYellow{background:#ffeb3b;color:#111}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:#fff;border-radius:12px;padding:14px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.stat b{font-size:22px;display:block}.stat small{color:#666}
.tabs{display:flex;gap:8px;margin-top:14px}
.tabs button{flex:1;padding:11px;border:1px solid #ddd;background:#fff;border-radius:20px;font-weight:800;cursor:pointer}
.tabs button.on{background:#111;color:#fff}
.order{border:1px solid #eee;border-radius:12px;padding:12px;margin-top:10px}
.order b{font-size:14px}.order small{color:#666;font-size:12px;line-height:1.6;display:block}
.row{display:flex;gap:8px;margin-top:8px}
.row button{flex:1;padding:9px;border:none;border-radius:8px;font-weight:900;cursor:pointer;font-size:13px}
.ok{background:#e8fff0;color:#00a651}.del{background:#ffe8ec;color:#ff2d55}.done{background:#eaf4ff;color:#007aff}
.loginBox{max-width:400px;margin:40px auto;background:#fff;border-radius:18px;padding:22px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.avatar{width:72px;height:72px;background:linear-gradient(135deg,#111,#00c853);color:#fff;font-size:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto}
.hide{display:none}
</style>
</head>
<body>
<div class="top"><b>ULTRA <span>TOP UP BD</span></b><br><small>🔐 Admin Panel</small></div>

<!-- LOGIN -->
<div class="wrap" id="loginWrap">
  <div class="loginBox">
    <div class="avatar">🔐</div>
    <h2 style="margin-top:12px">Admin Login</h2>
    <p style="color:#666;font-size:13px;margin-top:4px">শুধু Admin ঢুকতে পারবো</p>
    <input id="a_gmail" placeholder="Admin Gmail">
    <input id="a_pass" type="password" placeholder="Admin Password">
    <button class="btn" onclick="doAdminLogin()">Login →</button>
    <p id="loginMsg" style="color:red;font-weight:700;margin-top:10px"></p>
    <p style="font-size:12px;color:#888;margin-top:10px">Gmail: ultratupupbd@2026gmail.com<br>Password: Rana@1234# - এইটা শুধু তুমি জানবা</p>
  </div>
</div>

<!-- DASHBOARD -->
<div class="wrap hide" id="dashWrap">
  <div class="card" style="text-align:center;background:linear-gradient(135deg,#111,#00c853);color:#fff">
    <p>👋 Welcome, Admin Rana</p>
    <h2 style="margin-top:6px" id="totalSell">Tk 0</h2>
    <p style="font-size:12px;opacity:.9">Total Sell</p>
  </div>
  <div class="stats">
    <div class="stat"><b id="totalOrders">0</b><small>🛍️ Total Orders</small></div>
    <div class="stat"><b id="pendingOrders">0</b><small>⏳ Pending</small></div>
    <div class="stat"><b id="totalReseller">0</b><small>👑 Reseller Request</small></div>
    <div class="stat"><b id="totalUsers">0</b><small>👥 Total Users (This Device)</small></div>
  </div>
  <input id="searchOrder" placeholder="🔍 Search - Game / UID / TrxID / Phone" oninput="renderAdmin()">
  <div class="tabs">
    <button id="tabOrders" class="on" onclick="showTab('orders')">Orders</button>
    <button id="tabReseller" onclick="showTab('reseller')">Reseller</button>
    <button id="tabCodes" onclick="showTab('codes')">Redeem</button>
  </div>
  <div id="adminList"></div>
  <button class="btn2" onclick="refreshAdmin()">🔄 Refresh</button>
  <button class="btn2 btnRed" onclick="adminLogout()">Logout</button>
</div>

<script>
const ADMIN_GMAIL="ultratupupbd@2026gmail.com";
const ADMIN_PASS="Rana@1234#";
let curTab="orders";

function doAdminLogin(){
  let g=document.getElementById('a_gmail').value.trim();
  let p=document.getElementById('a_pass').value;
  if(g===ADMIN_GMAIL && p===ADMIN_PASS){
    localStorage.setItem("ut_admin_login","1");
    showDash();
  }else{
    document.getElementById('loginMsg').innerText="❌ Wrong Gmail / Password!";
  }
}
function adminLogout(){
  localStorage.removeItem("ut_admin_login");
  location.reload();
}
function showDash(){
  document.getElementById('loginWrap').classList.add('hide');
  document.getElementById('dashWrap').classList.remove('hide');
  renderAdmin();
}
function showTab(t){
  curTab=t;
  document.getElementById('tabOrders').className=t==='orders'?'on':'';
  document.getElementById('tabReseller').className=t==='reseller'?'on':'';
  document.getElementById('tabCodes').className=t==='codes'?'on':'';
  renderAdmin();
}
function refreshAdmin(){renderAdmin();alert("✅ Refreshed!")}

function renderAdmin(){
  let orders=JSON.parse(localStorage.getItem("ut_orders")||"[]");
  let reqs=JSON.parse(localStorage.getItem("ut_reseller_req")||"[]");
  let used=JSON.parse(localStorage.getItem("ut_used_codes")||"[]");
  let total=orders.reduce((s,o)=>s+(o.price||0),0);
  let pending=orders.filter(o=>o.status==="Pending").length;
  document.getElementById('totalSell').innerText="Tk "+total;
  document.getElementById('totalOrders').innerText=orders.length;
  document.getElementById('pendingOrders').innerText=pending;
  document.getElementById('totalReseller').innerText=reqs.length;
  document.getElementById('totalUsers').innerText=orders.length?new Set(orders.map(o=>o.phone)).size:0;

  let q=(document.getElementById('searchOrder').value||"").toLowerCase();
  let box=document.getElementById('adminList');

  if(curTab==="orders"){
    let list=orders.filter(o=>JSON.stringify(o).toLowerCase().includes(q));
    box.innerHTML=list.length?list.map((o,i)=>{
      let idx=orders.indexOf(o);
      return `<div class="order"><b>${o.game} - ${o.pkg}</b><small>UID / ID: ${o.pid||''}<br>TrxID: ${o.trx||''} | Pay: ${o.pay||''}<br>Phone: ${o.phone||'Guest'}<br>Status: ${o.status||'Pending'}<br>Time: ${o.time||''}</small><div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px"><b style="color:#00c853">Tk ${o.price}</b><span style="font-size:12px;background:#eee;padding:4px 8px;border-radius:10px">#${idx+1}</span></div><div class="row"><button class="done" onclick="markDone(${idx})">✅ Done</button><button class="del" onclick="deleteOrder(${idx})">🗑️ Delete</button><button class="ok" onclick="copyOrder(${idx})">📋 Copy</button></div></div>`
    }).join(''):'<p style="text-align:center;margin-top:16px;color:#666">No Order Found</p>';
  }
  if(curTab==="reseller"){
    box.innerHTML=reqs.length?reqs.map((r,i)=>`<div class="order"><b>👑 ${r.name||''} - ${r.phone}</b><small>Shop: ${r.shop||''}<br>User: ${r.user}<br>Total Spent: Tk ${r.totalSpent||0}<br>Status: ${r.status}<br>Time: ${r.time||''}</small><div class="row">${r.status!=='Approved'?`<button class="ok" onclick="approveResellerAdmin(${i})">✅ Approve</button>`:''}<button class="del" onclick="deleteReseller(${i})">🗑️ Delete</button></div></div>`).join(''):'<p style="text-align:center;margin-top:16px;color:#666">No Reseller Request</p>';
  }
  if(curTab==="codes"){
    box.innerHTML=`<div class="card"><h3>🎁 Redeem Codes (Active)</h3><p style="margin-top:8px;line-height:1.8">ULTRA50 = Tk 50<br>ULTRA100 = Tk 100<br>FREE10 = Tk 10<br>ULTRA200 = Tk 200<br>WELCOME20 = Tk 20</p></div><div class="card"><h3>✅ Used Codes (${used.length})</h3><p style="margin-top:8px">${used.join(', ')||'None'}</p></div>`;
  }
}
function markDone(i){
  let orders=JSON.parse(localStorage.getItem("ut_orders")||"[]");
  orders[i].status="Done ✅";
  localStorage.setItem("ut_orders",JSON.stringify(orders));
  renderAdmin();
}
function deleteOrder(i){
  if(!confirm("Delete this order?"))return;
  let orders=JSON.parse(localStorage.getItem("ut_orders")||"[]");
  orders.splice(i,1);
  localStorage.setItem("ut_orders",JSON.stringify(orders));
  renderAdmin();
}
function copyOrder(i){
  let orders=JSON.parse(localStorage.getItem("ut_orders")||"[]");
  let o=orders[i];
  let txt=`Game: ${o.game}\nPackage: ${o.pkg}\nPrice: Tk ${o.price}\nUID: ${o.pid}\nTrxID: ${o.trx}\nPay: ${o.pay}`;
  navigator.clipboard.writeText(txt).then(()=>alert("✅ Copied!"));
}
function approveResellerAdmin(i){
  let reqs=JSON.parse(localStorage.getItem("ut_reseller_req")||"[]");
  let r=reqs[i];
  localStorage.setItem("ut_is_reseller_"+r.user,"1");
  reqs[i].status="Approved";
  localStorage.setItem("ut_reseller_req",JSON.stringify(reqs));
  alert("✅ Reseller Approved: "+r.phone);
  renderAdmin();
}
function deleteReseller(i){
  if(!confirm("Delete reseller request?"))return;
  let reqs=JSON.parse(localStorage.getItem("ut_reseller_req")||"[]");
  reqs.splice(i,1);
  localStorage.setItem("ut_reseller_req",JSON.stringify(reqs));
  renderAdmin();
}
if(localStorage.getItem("ut_admin_login")==="1"){showDash();}
</script>
</body>
</html>
