<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULTRA - Admin Panel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0b0f1a;color:#fff;padding:14px;padding-bottom:80px}
h1{font-size:22px}h1 span{color:#00c853}
.card{background:#fff;color:#111;border-radius:14px;padding:14px;margin-top:12px}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-top:10px}
button{width:100%;background:#00c853;color:#fff;border:none;padding:12px;border-radius:10px;font-weight:900;margin-top:10px}
button.red{background:#ff2d55}button.black{background:#111}
.order{border:1px solid #eee;border-radius:10px;padding:10px;margin-top:10px}
.order b{color:#00c853}
small{color:#666}
.top{display:flex;justify-content:space-between;align-items:center}
.badge{background:#00c853;color:#fff;padding:4px 10px;border-radius:20px;font-size:12px}
</style>
</head>
<body>
<div id="loginBox">
<h1>ULTRA <span>TOP UP BD</span><br>Admin Panel</h1>
<p style="color:#aaa;margin-top:6px">Only Admin - 01837450067</p>
<div class="card">
<input id="adminPass" type="password" placeholder="Admin Password">
<button onclick="login()">Login →</button>
<p style="font-size:12px;color:#666;margin-top:8px">Default Password: 123456</p>
</div>
</div>

<div id="adminBox" style="display:none">
<div class="top"><h1>ULTRA <span>Admin</span></h1><span class="badge">● Live</span></div>
<p style="color:#aaa;margin-top:6px">Total Orders: <b id="totalOrders" style="color:#fff">0</b> | Total Sale: <b id="totalSale" style="color:#00e5a0">Tk 0</b></p>

<div class="card"><h3>🛍️ All Orders</h3><div id="ordersList"></div><button class="black" onclick="loadData()">🔄 Refresh</button></div>

<div class="card"><h3>👑 Reseller Requests</h3><div id="resellerList"></div></div>

<div class="card"><h3>⚙️ Admin Tools</h3>
<button onclick="copySiteLink()">📋 Copy Site Link</button>
<button onclick="copyReferLink()">📋 Copy My Refer Link</button>
<button class="red" onclick="clearOrders()">🗑️ Clear All Orders</button>
<button class="black" onclick="logout()">Logout</button>
</div>
</div>

<script>
function login(){
  if(document.getElementById('adminPass').value==="123456"){
    localStorage.setItem("ut_admin","1");
    showAdmin();
  } else alert("Wrong Password!");
}
function showAdmin(){
  document.getElementById('loginBox').style.display='none';
  document.getElementById('adminBox').style.display='block';
  loadData();
}
function logout(){localStorage.removeItem("ut_admin");location.reload();}
function loadData(){
  let orders=JSON.parse(localStorage.getItem("ut_orders")||"[]");
  let total=orders.reduce((s,o)=>s+(parseInt(o.price)||0),0);
  document.getElementById('totalOrders').innerText=orders.length;
  document.getElementById('totalSale').innerText="Tk "+total;
  document.getElementById('ordersList').innerHTML=orders.length?orders.map((o,i)=>`
  <div class="order">
  <b>${o.game} - ${o.pkg}</b> - Tk ${o.price}<br>
  <small>UID: ${o.pid||''} | Pay: ${o.pay||''} | Trx: ${o.trx||''}<br>
  Phone: ${o.phone||''} | ${o.time||''} | Status: ${o.status||'Pending'}</small><br>
  <button onclick="markDone(${i})">✅ Mark Done</button>
  </div>`).join(''):'<p>No Order Yet</p>';

  let reqs=JSON.parse(localStorage.getItem("ut_reseller_req")||"[]");
  document.getElementById('resellerList').innerHTML=reqs.length?reqs.map(r=>`
  <div class="order">
  <b>${r.name}</b> - ${r.phone}<br>
  <small>Shop: ${r.shop} | Spent: Tk ${r.totalSpent} | ${r.status}</small><br>
  ${r.status==='Pending'?`<button onclick="approve('${r.user}')">✅ Approve Reseller</button>`:''}
  </div>`).join(''):'<p>No Reseller Request</p>';
}
function markDone(i){
  let orders=JSON.parse(localStorage.getItem("ut_orders")||"[]");
  orders[i].status="Done";
  localStorage.setItem("ut_orders",JSON.stringify(orders));
  loadData(); alert("✅ Order Done!");
}
function approve(phone){
  localStorage.setItem("ut_is_reseller_"+phone,"1");
  let reqs=JSON.parse(localStorage.getItem("ut_reseller_req")||"[]");
  reqs=reqs.map(r=>r.user===phone?{...r,status:'Approved'}:r);
  localStorage.setItem("ut_reseller_req",JSON.stringify(reqs));
  loadData(); alert("✅ Reseller Approved: "+phone);
}
function clearOrders(){if(confirm("Sob order delete korba?")){localStorage.removeItem("ut_orders");loadData();}}
function copySiteLink(){navigator.clipboard.writeText('https://ultra-tup-up-bd.vercel.app/');alert("✅ Site Link Copied!")}
function copyReferLink(){navigator.clipboard.writeText('https://ultra-tup-up-bd.vercel.app/?ref=UTILCOM');alert("✅ Refer Link Copied!")}
if(localStorage.getItem("ut_admin")==="1") showAdmin();
</script>
</body>
</html>
